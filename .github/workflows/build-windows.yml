name: Windows 빌드

# PyInstaller는 크로스 컴파일을 지원하지 않는다. 윈도우용 실행 파일은 윈도우에서
# 빌드해야 하므로, 윈도우 PC 없이도 배포본을 만들 수 있도록 러너에서 빌드한다.
on:
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    tags:
      - "v*"                # v1.0 같은 태그를 밀면 자동 빌드

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 동작 확인
        env:
          QT_QPA_PLATFORM: offscreen   # 러너에는 화면이 없다
        run: python tools/smoke_test.py

      - name: 실행 파일 빌드
        run: pyinstaller --noconfirm CSATPromptGenerator.spec

      - name: 빌드 결과 확인
        shell: pwsh
        run: |
          $exe = "dist/CSATPromptGenerator/CSATPromptGenerator.exe"
          if (-not (Test-Path $exe)) { throw "실행 파일이 생성되지 않았습니다: $exe" }
          foreach ($d in @("templates", "config")) {
            if (-not (Test-Path "dist/CSATPromptGenerator/_internal/$d")) {
              throw "리소스가 포함되지 않았습니다: $d"
            }
          }
          $size = [math]::Round((Get-ChildItem dist/CSATPromptGenerator -Recurse |
                   Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "빌드 성공 — 총 $size MB"

      - name: 배포본 업로드
        uses: actions/upload-artifact@v4
        with:
          name: CSATPromptGenerator-windows
          path: dist/CSATPromptGenerator/
          retention-days: 30
